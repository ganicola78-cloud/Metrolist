      - name: Correggi ricerca Android Auto V6
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt')
          s = p.read_text()
          start = s.index('    override fun onSearch(')
          end = s.index('    override fun onGetSearchResult(', start)
          s = s[:start] + """    override fun onSearch(
                  session: MediaLibrarySession,
                  browser: MediaSession.ControllerInfo,
                  query: String,
                  params: MediaLibraryService.LibraryParams?
              ): ListenableFuture<LibraryResult<Void>> {
                  session.notifySearchResultChanged(browser, query, if (query.isBlank()) 0 else 1, params)
                  return Futures.immediateFuture(LibraryResult.ofVoid())
              }

          """ + s[end:]
          old = 'results.paginate(page.coerceAtLeast(0), pageSize.coerceAtLeast(0))'
          assert old in s
          s = s.replace(old, 'results.paginate(page.coerceAtLeast(0), if (pageSize <= 0) 100 else pageSize)')
          p.write_text(s)
          PYTHON
      - name: Correggi cronologia e coda della ricerca V6
        shell: bash
        run: |
          python3 - <<'PYV6'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt')
          s = p.read_text()
          old = '(onlineItems(remote, group, true) + local).distinctBy { it.mediaId }.take(limit)'
          assert s.count(old) == 1
          s = s.replace(old, '(local + onlineItems(remote, group, true)).distinctBy { it.mediaId }.take(limit)')
          anchor = '    private val trackCache = object : android.util.LruCache<String, MediaItem>(1500) {}'
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '\n    private val searchQueueCache = object : android.util.LruCache<String, List<MediaItem>>(1500) {}')
          anchor2 = '        (songs + sections + local).distinctBy { it.mediaId }.take(100)'
          assert s.count(anchor2) == 1
          s = s.replace(anchor2, '''        val results = (songs + sections + local).distinctBy { it.mediaId }.take(100)
                  val playable = results.filter { it.mediaMetadata.isPlayable == true }
                  playable.forEach { searchQueueCache.put(it.mediaId.removePrefix("auto_track/"), playable) }
                  results''')
          start = s.index('                "auto_track" -> {')
          end = s.index('                MusicService.SONG -> {', start)
          block = s[start:end]
          insertion = '''                    val searchItems = searchQueueCache.get(id)
                          ?.mapNotNull { entry ->
                              val raw = entry.mediaId.removePrefix("auto_track/")
                              trackCache.get(raw) ?: database.song(raw).first()?.toMediaItem()
                          }
                          ?.distinctBy { it.mediaId }
                          .orEmpty()
                      val selected = searchItems.indexOfFirst { it.mediaId == id }
                      if (selected >= 0 && searchItems.size > 1) {
                          withContext(Dispatchers.Main) { service.adoptQueue(ListQueue(items = searchItems)) }
                          return@future MediaItemsWithStartPosition(searchItems, selected, startPositionMs)
                      }
          '''
          at = '                    val metadata = track.localConfiguration?.tag as? com.metrolist.music.models.MediaMetadata'
          assert block.count(at) == 1
          s = s[:start] + block.replace(at, insertion + at) + s[end:]
          p.write_text(s)
          PYV6
