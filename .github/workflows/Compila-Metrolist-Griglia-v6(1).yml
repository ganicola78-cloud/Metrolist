name: Compila Metrolist Griglia per Android Auto V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilazione APK prova
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Scarica codice del progetto
        uses: actions/checkout@v4
      - name: Installa Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configura Android SDK (senza pacchetto tools obsoleto)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Installa API 37 e Build Tools 36
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Crea chiave di firma APK di prova
        shell: bash
        run: |
          # La configurazione Gradle di Metrolist richiede questo file per i build debug.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Metrolist Grid Test,C=IT" \
              -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"
